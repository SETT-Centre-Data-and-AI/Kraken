[project]
name = "datakraken"
version = "1.2.0"
description = "Kraken is a convenience package that orchestrates data extraction by integrating SQL with Python, while managing safe storage and recall of sensitive connection credentials."
authors = [
  { name = "Cai Davis" },
  { name = "Michael George" },
  { name = "Faizan Hemotra" },
]
license = "CC-BY-NC-4.0"
readme = "README.md"
requires-python = ">=3.10,<4"

# Dependencies
dependencies = [
  "sqlalchemy>=2.0.44,<3.0",
  "oracledb>=3.4.1,<4.0",
  "openpyxl>=3.1.5",
  "pyparsing>=3.2.5",
  "xlsxwriter>=3.2.9",
  "keyring>=25.7.0",
  "pandas>=2.3.3,<3.0",
  "pyodbc==5.2.0", # Pinned
  "matplotlib>=3.10.7,<4.0",
  "pyarrow>=22.0.0,<23.0.0",
  "pandasql>=0.7.3,<0.8",
  "pyyaml>=6.0.3",
  "seaborn>=0.13.2,<0.15",
  "xlrd>=2.0.2",
  "charset-normalizer>=3.4.4",
  "pymysql>=1.1.2",
  "mariadb>=1.1.14",
  "ipython>=8.37,<9.0",
  "psycopg2-binary>=2.9.11,<3.0",
  "duckdb>=1.4.2",
  "duckdb-engine>=0.17.0",
  "keyrings-alt>=5.0.2 ; sys_platform == 'linux'",
]
# Dev/Test Dependencies
[dependency-groups]
dev = [
  "pytest>=9.0.1,<10.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "commitizen>=4.1.1,<5.0.0",
  "python-dotenv>=1.2.1,<2.0.0",
  "mypy>=1.18.2,<2.0.0",
  "pandas-stubs>=2.3.2.250926,<3.0.0",
  "types-seaborn>=0.13.2.20250914,<1.0.0",
  "pre-commit>=4.4.0,<5.0.0",
  "ipykernel (>=7.1.0,<8.0.0)",
]

# URLs
[project.urls]
Repository = "https://github.com/SETT-Centre-Data-and-AI/Kraken"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/kraken",
]

[tool.hatch.build.targets.wheel]
include = [
    "src/kraken",
]

[tool.hatch.build.targets.wheel.sources]
"src/kraken" = "kraken"

[tool.poetry]
packages = [
  { include = "kraken", from = "src" },
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$major.$minor.$patch$prerelease"
version_type = "pep440"
version_provider = "pep621"
update_changelog_on_bump = false
major_version_zero = false
