[project]
name = "datakraken"
version = "1.1.12"
description = "Kraken is a convenience package that orchestrates data extraction by integrating SQL with Python, while managing safe storage and recall of sensitive connection credentials."
authors = [
  { name = "Cai Davis" },
  { name = "Michael George" },
  { name = "Faizan Hemotra" },
]
license = "CC-BY-NC-4.0"
readme = "README.md"
requires-python = ">=3.10,<4"

# Dependencies
dependencies = [
  "sqlalchemy>=2.0.11,<3.0",
  "oracledb>=2.4.1,<3.0",
  "openpyxl>=3.1.5",
  "pyparsing>=3.0.9",
  "xlsxwriter>=3.1.2",
  "keyring>=24.0",
  "pandas>=2.0.2,<3.0",
  "pyodbc==5.2.0", # Pinned
  "matplotlib>=3.8,<4.0",
  "pyarrow>=19.0.0,<20.0.0",
  "pandasql>=0.7.3,<0.8",
  "pyyaml>=6.0.1",
  "seaborn>=0.13,<0.15",
  "xlrd>=2.0.1",
  "charset-normalizer>=3.3.2",
  "pymysql>=1.1.1",
  "mariadb>=1.1.10",
  "ipython>=8.34,<9.0",
  "psycopg2-binary>=2.9.10,<3.0",
  "duckdb>=1.4.2",
  "duckdb-engine>=0.17.0",
  "keyrings-alt>=5.0.2 ; sys_platform == 'linux'",
]
# Dev/Test Dependencies
[dependency-groups]
dev = [
  "pytest>=8.3.2,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "commitizen>=3.1.0,<4.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "mypy>=1.15.0,<2.0.0",
  "pandas-stubs>=2.2.3.241126,<3.0.0",
  "types-seaborn>=0.13.2.20250111,<1.0.0",
  "pre-commit>=4.2.0,<5.0.0",
  "ipykernel (>=7.1.0,<8.0.0)",
]

# URLs
[project.urls]
Repository = "https://github.com/SETT-Centre-Data-and-AI/Kraken"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/kraken",
]

[tool.hatch.build.targets.wheel]
include = [
    "src/kraken",
]

[tool.hatch.build.targets.wheel.sources]
"src/kraken" = "kraken"

[tool.poetry]
packages = [
  { include = "kraken", from = "src" },
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$major.$minor.$patch$prerelease"
version_type = "pep440"
version_provider = "pep621"
update_changelog_on_bump = false
major_version_zero = false
